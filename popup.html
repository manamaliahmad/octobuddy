<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 300px; font-family: Inter, system-ui, sans-serif; color: #1c2420; }
  .photo { width: 100%; height: 118px; object-fit: cover; display: block; }
  .box { padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 2px; }
  p.tag { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #6b7280; margin: 12px 0 6px; }
  input[type="text"] { width: 100%; padding: 9px 11px; border: 1px solid #e7e0d3; border-radius: 10px; font: inherit; font-size: 14px; }
  input[type="range"] { width: 100%; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .row span { font-size: 14px; font-weight: 600; }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; background: #d8d2c4; border-radius: 99px; cursor: pointer; transition: .2s; }
  .track:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .track { background: #25d366; }
  .switch input:checked + .track:before { transform: translateX(18px); }
  .val { font-size: 12px; color: #6b7280; }
  .pets { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .pets button { border: 1px solid #e7e0d3; background: #fff; border-radius: 12px; padding: 9px 2px 7px; cursor: pointer; font: inherit; }
  .pets button .em { display: block; font-size: 22px; }
  .pets button .nm { display: block; font-size: 11px; font-weight: 600; color: #1c2420; margin-top: 2px; }
  .pets button.sel { border-color: #9cc8ef; background: #eaf4ff; }
  .foot { margin-top: 14px; font-size: 12px; color: #6b7280; line-height: 1.5; }
</style>
</head>
<body>
  <img class="photo" src="assets/octopus-plush.jpg" alt="OctoBuddy plush">
  <div class="box">
    <h1>OctoBuddy</h1>
    <p class="tag">Your cute screen pet — following your cursor on every page.</p>

    <label>Choose your pet</label>
    <div class="pets">
      <button type="button" data-pet="octopus"><span class="em">🐙</span><span class="nm">Octopus</span></button>
      <button type="button" data-pet="bee"><span class="em">🐝</span><span class="nm">Bee</span></button>
      <button type="button" data-pet="lizard"><span class="em">🦎</span><span class="nm">Lizard</span></button>
      <button type="button" data-pet="duck"><span class="em">🤖</span><span class="nm">MicroDuck</span></button>
    </div>

    <div class="row">
      <span>Pet on / off</span>
      <label class="switch"><input type="checkbox" id="enabled"><span class="track"></span></label>
    </div>

    <label>Pet name</label>
    <input type="text" id="petName" maxlength="20" placeholder="Ollie">

    <label>Size — <span class="val" id="sizeVal">90px</span></label>
    <input type="range" id="size" min="60" max="140" step="5">

    <label>Follow speed — <span class="val" id="speedVal">5</span></label>
    <input type="range" id="speed" min="1" max="10" step="1">

    <p class="foot">Click the pet — it jumps and sends hearts. Leave the mouse still for 20 seconds and it falls asleep (Zzz).<br>Open source (MIT) — remix and share freely.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
